<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#102b30">
<title>Fox Clicker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main id="game-shell">
  <canvas id="game" width="960" height="540" aria-label="Fox Clicker"></canvas>

  <header class="hud">
    <section class="hud-left">
      <div class="counter coin-counter">
        <span class="coin-icon" aria-hidden="true"></span>
        <div><strong id="coins">0</strong><small>MOEDAS</small></div>
      </div>
      <div class="counter"><div><strong id="level">1</strong><small>NÍVEL</small></div></div>
      <div class="counter"><div><strong>+<span id="power">1</span></strong><small>POR CLIQUE</small></div></div>
    </section>
    <section class="hud-right">
      <div class="combo" id="combo">COMBO <strong>x1</strong></div>
      <button id="reset" class="small-button" type="button">RESET</button>
    </section>
  </header>

  <div id="message" class="message" aria-live="polite"></div>

  <footer class="dock">
    <button id="upgrade" class="action-card primary" type="button">
      <span class="action-title">MELHORAR</span>
      <span class="action-sub">+1 poder</span>
      <span class="action-cost"><span class="coin-mini"></span><span id="upgrade-cost">12</span></span>
    </button>
    <div class="milestone">
      <div class="milestone-head"><span>PRÓXIMO BAÚ</span><strong id="chest-progress">0 / 25</strong></div>
      <div class="progress"><i id="progress"></i></div>
    </div>
    <button id="chest" class="action-card" type="button" disabled>
      <span class="action-title">BAÚ</span>
      <span class="action-sub">a cada 25 cliques</span>
      <span class="action-cost"><span id="chest-reward">+25</span> moedas</span>
    </button>
  </footer>

  <div class="hint">CLIQUE NA RAPOSA</div>
</main>
<script src="game.js"></script>
</body>
</html>
