<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fox Clicker</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#173c43}
body{font-family:"Courier New",monospace}
canvas{display:block;position:absolute;inset:0;width:100vw;height:100vh;image-rendering:pixelated;image-rendering:crisp-edges;cursor:pointer}
.ui{position:fixed;inset:0;pointer-events:none;color:#fff;text-shadow:3px 3px #18343a}
.stats{position:absolute;top:18px;left:20px;display:flex;gap:24px;align-items:center}
.stat{display:flex;align-items:center;gap:9px;font-size:24px;font-weight:900}
.coin{width:25px;height:25px;background:#f6c62e;border:3px solid #8b551d;box-shadow:inset 4px 4px #ffe978,inset -3px -3px #c67e17;position:relative}
.coin:after{content:"";position:absolute;width:4px;height:13px;left:7px;top:3px;background:#fff1a6;box-shadow:6px 0 #fff1a6}
.side{position:absolute;top:18px;right:20px;display:flex;gap:8px;pointer-events:auto}
.side button{border:3px solid #f6e6b0;background:#355f50;color:#fff;padding:8px 11px;font:900 12px "Courier New";cursor:pointer;box-shadow:3px 3px #18343a}
.side button:active{transform:translate(2px,2px);box-shadow:1px 1px #18343a}
.bottom{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:10px;pointer-events:auto}
.card{min-width:145px;padding:8px 12px;background:#7b39c9;border:3px solid #e8d7ff;box-shadow:4px 4px #32164e;color:#fff;text-align:center;font-weight:900;cursor:pointer}
.card small{display:block;font-size:10px;margin-top:3px;color:#e9d9ff}
.card.locked{background:#4a3c58;color:#aaa;border-color:#83778d}
.toast{position:absolute;left:50%;top:72px;transform:translateX(-50%);font-size:13px;font-weight:900;opacity:0;transition:opacity .15s}
.toast.show{opacity:1}
</style>
</head>
<body>
<canvas id="game" width="320" height="180" aria-label="Clique na raposa para ganhar moedas"></canvas>
<div class="ui">
  <div class="stats">
    <div class="stat"><span class="coin"></span><span id="coins">0</span></div>
    <div class="stat">NÍVEL <span id="level">1</span></div>
    <div class="stat">+<span id="power">1</span></div>
  </div>
  <div class="side">
    <button id="reset">RESET</button>
  </div>
  <div class="toast" id="toast"></div>
  <div class="bottom">
    <div class="card" id="upgrade">MELHORAR RAPOSA<small><span id="cost">10</span> moedas</small></div>
    <div class="card locked" id="chest">BAÚ <small>clique 10 vezes</small></div>
  </div>
</div>
<script>
const canvas=document.getElementById("game"),ctx=canvas.getContext("2d");\nctx.imageSmoothingEnabled=false;
const coinsEl=document.getElementById("coins"),levelEl=document.getElementById("level"),powerEl=document.getElementById("power"),costEl=document.getElementById("cost"),toast=document.getElementById("toast");
const W=320,H=180;
function loadNumber(key,fallback,min=0){const value=Number(localStorage.getItem(key));return Number.isFinite(value)&&value>=min?value:fallback}
let coins=loadNumber("foxCoins",0),level=loadNumber("foxLevel",1,1),power=loadNumber("foxPower",1,1),clicks=loadNumber("foxClicks",0),upgradeCost=loadNumber("foxCost",10,1);
let particles=[],floaters=[],chestOpen=0,fox={x:160,y:99,pressed:0},last=0;
const rect=(x,y,w,h,c)=>{ctx.fillStyle=c;ctx.fillRect(x,y,w,h)};
function save(){localStorage.setItem("foxCoins",coins);localStorage.setItem("foxLevel",level);localStorage.setItem("foxPower",power);localStorage.setItem("foxClicks",clicks);localStorage.setItem("foxCost",upgradeCost)}
function ui(){coinsEl.textContent=coins;levelEl.textContent=level;powerEl.textContent=power;costEl.textContent=upgradeCost;document.getElementById("chest").classList.toggle("locked",clicks<10)}
function world(){
rect(0,0,W,H,"#237c73");
for(let y=0;y<H;y+=16)for(let x=0;x<W;x+=16)if((x/16+y/16)%2===0)rect(x,y,16,16,"#2a8776");
rect(0,133,W,47,"#4c9e55");
for(let x=0;x<W;x+=20){rect(x,129,4,10,"#337d4c");rect(x+7,126,3,13,"#337d4c")}
rect(18,104,25,4,"#7ac56b");rect(27,99,9,5,"#7ac56b");rect(266,112,30,4,"#7ac56b");rect(277,107,8,5,"#7ac56b");
rect(59,42,8,4,"#46a08b");rect(63,38,4,4,"#46a08b");rect(235,54,8,4,"#46a08b");rect(239,50,4,4,"#46a08b");
for(let i=0;i<18;i++){let x=(i*71+31)%W,y=(i*43+17)%115;rect(x,y,2,2,i%2?"#b4d96b":"#3c9a72")}
}
function drawFox(){
const s=.43,cy=Math.round(fox.y+(fox.pressed?3:0));ctx.save();ctx.translate(Math.round(fox.x),cy);ctx.scale(s,s);
rect(27,14,18,18,"#d85c2d");rect(39,18,10,12,"#ffad35");rect(45,20,7,8,"#fff0bd");rect(23,19,12,15,"#ee7530");
rect(-25,8,50,32,"#d85c2d");rect(-20,30,12,16,"#b9472d");rect(8,30,12,16,"#b9472d");rect(-10,22,20,18,"#ffad35");rect(-5,25,10,13,"#fff0bd");
rect(-29,-23,58,45,"#e66b2e");rect(-24,-31,17,15,"#d85c2d");rect(7,-31,17,15,"#d85c2d");rect(-20,-25,11,10,"#ffd064");rect(9,-25,11,10,"#ffd064");
rect(-25,-32,12,7,"#6e3040");rect(13,-32,12,7,"#6e3040");rect(-21,-10,14,12,"#fff0bd");rect(7,-10,14,12,"#fff0bd");
rect(-15,-7,7,7,"#172a2d");rect(8,-7,7,7,"#172a2d");rect(-3,1,6,5,"#172a2d");rect(-7,6,14,5,"#fff0bd");
rect(-26,3,10,8,"#ffad35");rect(16,3,10,8,"#ffad35");rect(-29,39,13,8,"#ffd064");rect(16,39,13,8,"#ffd064");ctx.restore()
}
function coin(x,y,size=7){x=Math.round(x);y=Math.round(y);rect(x,y,size,size,"#9a5a1e");rect(x+2,y-2,size,size,"#f6c62e");rect(x+3,y-1,3,4,"#ffe978")}
function chest(){
if(chestOpen<=0)return;
const x=160,y=84;
rect(x-17,y-10,34,25,"#70432b");rect(x-14,y-7,28,8,"#b87532");rect(x-13,y+2,26,10,"#8f5429");rect(x-3,y-1,6,8,"#f6c62e");
rect(x-20,y-13,4,4,"#ffe978");rect(x+16,y-13,4,4,"#ffe978");
}
function particlesDraw(){
particles.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.025;p.life--;coin(p.x,p.y,p.size)});
particles=particles.filter(p=>p.life>0);
floaters.forEach(p=>{p.y+=p.vy;p.life--;ctx.font="900 9px Courier New";ctx.textAlign="center";ctx.fillStyle=p.c;ctx.fillText(p.text,p.x,p.y)});
floaters=floaters.filter(p=>p.life>0)
}
function clickFox(e){
const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*W/r.width,y=(e.clientY-r.top)*H/r.height;
const dx=(x-fox.x)/1.15,dy=(y-(fox.y-2))/1.15;
if(dx*dx+dy*dy>260)return;
coins+=power;clicks++;fox.pressed=1;
for(let i=0;i<Math.min(power,8);i++)particles.push({x:fox.x+(Math.random()-.5)*14,y:fox.y-19,vx:(Math.random()-.5)*.35,vy:-.7-Math.random()*.6,life:35+Math.random()*15,size:6});
floaters.push({x:fox.x,y:fox.y-35,vy:-.35,life:35,text:"+"+power,c:"#fff3a8"});
if(clicks>=10&&clicks%10===0){chestOpen=70;const reward=power*5;coins+=reward;floaters.push({x:160,y:65,vy:-.2,life:70,text:"BAÚ +"+reward,c:"#ffe05b"});toast.textContent="BAÚ ENCONTRADO";toast.classList.add("show");setTimeout(()=>toast.classList.remove("show"),700)}
save();ui()
}
function upgrade(){
if(coins<upgradeCost)return;
coins-=upgradeCost;level++;power++;upgradeCost=Math.ceil(upgradeCost*1.65);save();ui();
floaters.push({x:160,y:75,vy:-.3,life:45,text:"PODER AUMENTADO",c:"#fff"});fox.pressed=1
}
function loop(t){const dt=Math.min(50,t-last);last=t;if(fox.pressed>0)fox.pressed=Math.max(0,fox.pressed-dt/100);if(chestOpen>0)chestOpen-=dt/16;world();chest();drawFox();particlesDraw();requestAnimationFrame(loop)}
canvas.addEventListener("click",clickFox);
document.getElementById("upgrade").addEventListener("click",upgrade);
document.getElementById("reset").addEventListener("click",()=>{coins=0;level=1;power=1;clicks=0;upgradeCost=10;particles=[];floaters=[];chestOpen=0;save();ui()});
ui();requestAnimationFrame(loop);
</script>
</body>
</html>
