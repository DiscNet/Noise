<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
<title id="title">Noise! — editor de imagens para Android</title><desc id="desc">Marca Noise em composição escura com cartões translúcidos lilás e demonstração ilustrativa de efeito dither.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0A12"/><stop offset=".58" stop-color="#13101D"/><stop offset="1" stop-color="#090812"/></linearGradient>
<radialGradient id="ambient"><stop stop-color="#C765F6" stop-opacity=".32"/><stop offset=".5" stop-color="#9152C6" stop-opacity=".13"/><stop offset="1" stop-color="#6A37BE" stop-opacity="0"/></radialGradient>
<radialGradient id="amber"><stop stop-color="#F69ACF" stop-opacity=".23"/><stop offset="1" stop-color="#F69ACF" stop-opacity="0"/></radialGradient>
<linearGradient id="icon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#3D2C55"/><stop offset=".48" stop-color="#1A142A"/><stop offset="1" stop-color="#100E19"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#65537E" stop-opacity=".88"/><stop offset=".45" stop-color="#352C4A" stop-opacity=".73"/><stop offset="1" stop-color="#251F39" stop-opacity=".87"/></linearGradient>
