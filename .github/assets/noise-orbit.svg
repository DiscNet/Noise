<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-labelledby="title desc">
<title id="title">Noise! — Navegação orbital</title>
<desc id="desc">Duas ilustrações lado a lado mostram o menu Efeitos em roda na esquerda e Ferramentas em roda na direita, com fundo em gradiente violeta.</desc>
<defs>
<linearGradient id="back" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B0913"/><stop offset=".5" stop-color="#1A1224"/><stop offset="1" stop-color="#0D0A15"/></linearGradient>
<linearGradient id="pane" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#251832"/><stop offset="1" stop-color="#110D1A"/></linearGradient>
<linearGradient id="fadeL" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D9A6F4" stop-opacity=".18"/><stop offset="1" stop-color="#D9A6F4" stop-opacity="0"/></linearGradient>
<linearGradient id="fadeR" x1="1" y1="0" x2="0" y2="0"><stop stop-color="#D9A6F4" stop-opacity=".18"/><stop offset="1" stop-color="#D9A6F4" stop-opacity="0"/></linearGradient>
<radialGradient id="aura"><stop stop-color="#D6A3FF" stop-opacity=".28"/><stop offset="1" stop-color="#D6A3FF" stop-opacity="0"/></radialGradient>
<linearGradient id="active" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E6B6FF"/><stop offset="1" stop-color="#BA85ED"/></linearGradient>
<clipPath id="round"><rect x="8" y="8" width="1184" height="404" rx="23"/></clipPath>
</defs>
