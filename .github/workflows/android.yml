name: Build Noise APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: noise-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Prepare installable preview
        run: |
          VERSION=$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" app/build.gradle)
          test -n "$VERSION"
          cp app/build/outputs/apk/debug/app-debug.apk "Noise.V${VERSION}-preview.apk"
          echo "PREVIEW_APK=Noise.V${VERSION}-preview.apk" >> "$GITHUB_ENV"
          echo "PREVIEW_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "::notice::Preview APK uses a temporary debug key; install the official Release for permanent updates."
      - name: Upload installable preview before emulator
        uses: actions/upload-artifact@v4
        with:
          name: Noise-V${{ env.PREVIEW_VERSION }}-Preview
          path: ${{ env.PREVIEW_APK }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify GPU editor on Android
        timeout-minutes: 33
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 180
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back emulated -camera-front emulated
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Start gallery without a runtime permission modal during GPU smoke tests.
            adb shell pm grant com.discnet.noise android.permission.READ_EXTERNAL_STORAGE || true
            adb shell pm grant com.discnet.noise android.permission.CAMERA
            mkdir -p smoke
            # Focused pull-request gate. Run exhaustive 60-control suite
            # manually without -e noise_test_mode; it exceeds SwiftShader CI time.
            timeout 900s adb shell am instrument -w -e noise_test_mode targeted com.discnet.noise.test/com.discnet.noise.NoiseSmokeTest | tee smoke/results.txt
            timeout 15s adb logcat -d > smoke/logcat.txt || true
            timeout 15s adb exec-out screencap -p > smoke/device-after-tests.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-ui.png > smoke/noise-ui.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-opening.png > smoke/noise-opening.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-open.png > smoke/noise-open.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-closing.png > smoke/noise-closing.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-panel.png > smoke/noise-panel.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-transform.png > smoke/noise-transform.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-projects.png > smoke/noise-projects.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-presets.png > smoke/noise-presets.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-home.png > smoke/noise-home.png || true
            grep -q NOISE_SMOKE_OK smoke/results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Noise-smoke-tests
          path: smoke/
      - name: Validate release signing with a disposable test key
        run: |
          set -euo pipefail
          umask 077
          FIXTURE_DIR=$(mktemp -d)
          trap 'rm -rf "$FIXTURE_DIR" release' EXIT
          export NOISE_SIGNING_STORE_PASSWORD=$(openssl rand -hex 32)
          export NOISE_SIGNING_KEY_PASSWORD="$NOISE_SIGNING_STORE_PASSWORD"
          export NOISE_SIGNING_KEY_ALIAS=noise-ci-fixture
          keytool -genkeypair -noprompt -storetype PKCS12 \
            -keystore "$FIXTURE_DIR/test.p12" -alias "$NOISE_SIGNING_KEY_ALIAS" \
            -keyalg RSA -keysize 3072 -validity 2 -dname 'CN=Noise CI Fixture' \
            -storepass:env NOISE_SIGNING_STORE_PASSWORD \
            -keypass:env NOISE_SIGNING_KEY_PASSWORD
          export NOISE_SIGNING_KEYSTORE_B64=$(base64 -w 0 "$FIXTURE_DIR/test.p12")
          bash scripts/build-signed-release.sh

  release:
    name: Publish official signed APK
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require all four signing secrets
        env:
          NOISE_SIGNING_KEYSTORE_B64: ${{ secrets.NOISE_SIGNING_KEYSTORE_B64 }}
          NOISE_SIGNING_STORE_PASSWORD: ${{ secrets.NOISE_SIGNING_STORE_PASSWORD }}
          NOISE_SIGNING_KEY_ALIAS: ${{ secrets.NOISE_SIGNING_KEY_ALIAS }}
          NOISE_SIGNING_KEY_PASSWORD: ${{ secrets.NOISE_SIGNING_KEY_PASSWORD }}
        run: bash scripts/build-signed-release.sh --check-secrets
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          cache-disabled: true
      - name: Build and verify the permanent release signature
        env:
          NOISE_SIGNING_KEYSTORE_B64: ${{ secrets.NOISE_SIGNING_KEYSTORE_B64 }}
          NOISE_SIGNING_STORE_PASSWORD: ${{ secrets.NOISE_SIGNING_STORE_PASSWORD }}
          NOISE_SIGNING_KEY_ALIAS: ${{ secrets.NOISE_SIGNING_KEY_ALIAS }}
          NOISE_SIGNING_KEY_PASSWORD: ${{ secrets.NOISE_SIGNING_KEY_PASSWORD }}
        run: bash scripts/build-signed-release.sh
      - name: Upload verified official APK
        uses: actions/upload-artifact@v4
        with:
          name: Noise-V${{ env.APP_VERSION }}-Official
          path: release/
          if-no-files-found: error
      - name: Publish Noise release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="v${APP_VERSION}"
          NOTES="docs/RELEASE-${APP_VERSION}.md"
          test -s "$NOTES"
          # A published version is never overwritten by a rebuild.
          gh release create "$TAG" \
            "release/$APK_FILE" "release/$APK_FILE.sha256" \
            release/SIGNING-CERTIFICATE.txt \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --title "Noise! V${APP_VERSION}" --notes-file "$NOTES" --latest
          echo "Publicado: https://github.com/$GITHUB_REPOSITORY/releases/tag/$TAG" >> "$GITHUB_STEP_SUMMARY"
