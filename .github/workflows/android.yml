name: Build Noise APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: noise-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 36
    steps:
      - name: Cancel superseded builds
        uses: actions/github-script@v7
        with:
          script: |
            const current = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId });
            const { data } = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'android.yml', branch: current.data.head_branch, status: 'in_progress', per_page: 30 });
            for (const run of data.workflow_runs) {
              if (run.id !== context.runId && run.created_at < current.data.created_at) {
                try { await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id }); }
                catch (error) { if (error.status !== 409) throw error; }
              }
            }
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      # Debug keystore caching is NOT a reliable update identity: public
      # preview runs produced distinct signer fingerprints in the past.
      # A persistent certificate must be stored as repository secrets.
      - name: Configure permanent APK signature
        env:
          NOISE_KEYSTORE_B64: ${{ secrets.NOISE_SIGNING_KEYSTORE_B64 }}
          NOISE_STORE_PASS: ${{ secrets.NOISE_SIGNING_STORE_PASSWORD }}
          NOISE_SIGN_ALIAS: ${{ secrets.NOISE_SIGNING_KEY_ALIAS }}
          NOISE_SIGN_KEY_PASS: ${{ secrets.NOISE_SIGNING_KEY_PASSWORD }}
        run: |
          if [ -n "$NOISE_KEYSTORE_B64" ]; then
            test -n "$NOISE_STORE_PASS" && test -n "$NOISE_SIGN_ALIAS" && test -n "$NOISE_SIGN_KEY_PASS" || {
              echo "::error::Incomplete permanent APK signing secrets"; exit 1;
            }
            umask 077
            printf '%s' "$NOISE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/noise-signing.jks"
            test -s "$RUNNER_TEMP/noise-signing.jks" || exit 1
            echo "NOISE_KEYSTORE_PATH=$RUNNER_TEMP/noise-signing.jks" >> "$GITHUB_ENV"
            echo "NOISE_KEYSTORE_PASSWORD=$NOISE_STORE_PASS" >> "$GITHUB_ENV"
            echo "NOISE_KEY_ALIAS=$NOISE_SIGN_ALIAS" >> "$GITHUB_ENV"
            echo "NOISE_KEY_PASSWORD=$NOISE_SIGN_KEY_PASS" >> "$GITHUB_ENV"
            echo "NOISE_SIGNER_MODE=permanent" >> "$GITHUB_ENV"
          else
            if [ "$GITHUB_REF" = "refs/heads/main" ]; then
              echo "::error::Official releases require permanent signing secrets; see docs/APK-UPDATES.md."
              exit 1
            fi
            echo "::warning::PREVIEW ONLY: signing secrets are absent. The generated APK cannot reliably update an existing installation."
            echo "NOISE_SIGNER_MODE=temporary-debug" >> "$GITHUB_ENV"
          fi
      - run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Prepare installable preview
        run: |
          VERSION=$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" app/build.gradle)
          test -n "$VERSION"
          cp app/build/outputs/apk/debug/app-debug.apk "Noise.V${VERSION}.apk"
          echo "PREVIEW_APK=Noise.V${VERSION}.apk" >> "$GITHUB_ENV"
          echo "PREVIEW_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "PREVIEW_CERT=$NOISE_SIGNER_MODE" >> "$GITHUB_ENV"
      - name: Upload installable preview before emulator
        uses: actions/upload-artifact@v4
        with:
          name: Noise-V${{ env.PREVIEW_VERSION }}-Preview
          path: ${{ env.PREVIEW_APK }}
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify GPU editor on Android
        timeout-minutes: 33
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 180
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Start gallery without a runtime permission modal during GPU smoke tests.
            adb shell pm grant com.discnet.noise android.permission.READ_EXTERNAL_STORAGE || true
            mkdir -p smoke
            timeout 1800s adb shell am instrument -w com.discnet.noise.test/com.discnet.noise.NoiseSmokeTest | tee smoke/results.txt
            timeout 15s adb logcat -d > smoke/logcat.txt || true
            timeout 15s adb exec-out screencap -p > smoke/device-after-tests.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-ui.png > smoke/noise-ui.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-opening.png > smoke/noise-opening.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-open.png > smoke/noise-open.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-closing.png > smoke/noise-closing.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-panel.png > smoke/noise-panel.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-transform.png > smoke/noise-transform.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-projects.png > smoke/noise-projects.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-presets.png > smoke/noise-presets.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-home.png > smoke/noise-home.png || true
            grep -q NOISE_SMOKE_OK smoke/results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Noise-smoke-tests
          path: smoke/
      - name: Rename APK with version
        run: |
          VERSION=$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" app/build.gradle)
          test -n "$VERSION"
          FILE="Noise.V${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          echo "APK_FILE=$FILE" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Noise-V${{ env.APP_VERSION }}
          path: ${{ env.APK_FILE }}
      - name: Publish installable APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK_FILE" --title "Noise! V${APP_VERSION} ($TAG)" --notes-file docs/RELEASE-1.30.1.md
