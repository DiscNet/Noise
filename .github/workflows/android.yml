name: Build Noise APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: noise-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Cancel superseded builds
        uses: actions/github-script@v7
        with:
          script: |
            const current = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId });
            const { data } = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'android.yml', branch: current.data.head_branch, status: 'in_progress', per_page: 30 });
            for (const run of data.workflow_runs) {
              if (run.id !== context.runId && run.created_at < current.data.created_at) {
                try { await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id }); }
                catch (error) { if (error.status !== 409) throw error; }
              }
            }
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: noise-development-signing-v1
      - run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify GPU editor on Android
        timeout-minutes: 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 180
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            # Start gallery without a runtime permission modal during GPU smoke tests.
            adb shell pm grant com.discnet.noise android.permission.READ_EXTERNAL_STORAGE || true
            mkdir -p smoke
            timeout 480s adb shell am instrument -w com.discnet.noise.test/com.discnet.noise.NoiseSmokeTest | tee smoke/results.txt
            timeout 15s adb logcat -d > smoke/logcat.txt || true
            timeout 15s adb exec-out screencap -p > smoke/device-after-tests.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-ui.png > smoke/noise-ui.png || true
            grep -q NOISE_SMOKE_OK smoke/results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Noise-smoke-tests
          path: smoke/
      - name: Rename APK with version
        run: |
          VERSION=$(sed -n "s/.*versionName '\\([^']*\\)'.*/\\1/p" app/build.gradle)
          test -n "$VERSION"
          FILE="Noise! V${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "$FILE"
          echo "APK_FILE=$FILE" >> "$GITHUB_ENV"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: Noise-V${{ env.APP_VERSION }}
          path: ${{ env.APK_FILE }}
      - name: Publish installable APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$APK_FILE" --title "Noise! V${APP_VERSION} ($TAG)" --notes "Noise! V${APP_VERSION}: interface mais compacta e confortável, controles de intensidade até 200%, Glow nítido sem rastros, Névoa sem blur e Realce de bordas no lugar do desfoque rotativo. Mantém a edição GPU em tempo real, ASCII, Dither, galeria, recorte e salvamento em Pictures/Noise!. Android 8+."
