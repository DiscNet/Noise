name: Build Noise APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  actions: write
concurrency:
  group: noise-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Cancel superseded builds
        uses: actions/github-script@v7
        with:
          script: |
            const current = await github.rest.actions.getWorkflowRun({ ...context.repo, run_id: context.runId });
            const { data } = await github.rest.actions.listWorkflowRuns({ ...context.repo, workflow_id: 'android.yml', branch: current.data.head_branch, status: 'in_progress', per_page: 30 });
            for (const run of data.workflow_runs) {
              if (run.id !== context.runId && run.created_at < current.data.created_at) {
                try { await github.rest.actions.cancelWorkflowRun({ ...context.repo, run_id: run.id }); }
                catch (error) { if (error.status !== 409) throw error; }
              }
            }
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: noise-development-signing-v1
      - run: gradle --no-daemon assembleDebug assembleDebugAndroidTest
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify GPU editor on Android
        timeout-minutes: 9
        uses: reactivecircus/android-emulator-runner@v2
        with:
          emulator-boot-timeout: 180
          api-level: 29
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            adb install app/build/outputs/apk/debug/app-debug.apk
            adb install app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk
            mkdir -p smoke
            timeout 240s adb shell am instrument -w com.discnet.noise.test/com.discnet.noise.NoiseSmokeTest | tee smoke/results.txt
            timeout 15s adb logcat -d > smoke/logcat.txt || true
            timeout 15s adb exec-out screencap -p > smoke/device-after-tests.png || true
            timeout 15s adb exec-out run-as com.discnet.noise cat files/noise-ui.png > smoke/noise-ui.png || true
            grep -q NOISE_SMOKE_OK smoke/results.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Noise-smoke-tests
          path: smoke/
      - run: cp app/build/outputs/apk/debug/app-debug.apk Noise.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Noise-APK
          path: Noise.apk
      - name: Publish installable APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="build-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Noise.apk --title "Noise! 1.4 ($TAG)" --notes "Noise! 1.4: Fade, Tom de pele, Poeira, Vinheta, Aberrações, Névoa, Glow independente e Nitidez. Quatro abas, processamento GPU em tempo real e exportação PNG. APK de teste, Android 8+. Se a assinatura antiga impedir a atualização, desinstale a versão 1.0 antes."
