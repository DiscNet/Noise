plugins { id 'com.android.application' }
android { namespace 'com.discnet.noise'; compileSdk 35
 defaultConfig { applicationId 'com.discnet.noise'; minSdk 26; targetSdk 35; versionCode 37; versionName '1.30.3'; testInstrumentationRunner 'com.discnet.noise.NoiseSmokeTest' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}

// Official updates must use ONE permanent key for the lifetime of the app.
// Secret values are delivered through GitHub Actions environment variables,
// never embedded in repository source code or distributed APK contents.
def noiseKeyPath = System.getenv('NOISE_KEYSTORE_PATH')
def noiseStorePassword = System.getenv('NOISE_KEYSTORE_PASSWORD')
def noiseKeyAlias = System.getenv('NOISE_KEY_ALIAS')
def noiseKeyPassword = System.getenv('NOISE_KEY_PASSWORD')
if (noiseKeyPath) {
    if (!noiseStorePassword || !noiseKeyAlias || !noiseKeyPassword) {
        throw new GradleException('NOISE signing is incomplete; configure all 4 signing values.')
    }
    android.signingConfigs.create('noiseStable') {
        storeFile = file(noiseKeyPath)
        storePassword = noiseStorePassword
        keyAlias = noiseKeyAlias
        keyPassword = noiseKeyPassword
    }
    // Debug/previews retain a disposable debug identity. The permanent key
    // is used only by the trusted release job, never by pull-request builds.
    android.buildTypes.release.signingConfig = android.signingConfigs.noiseStable
}

android.buildTypes.release {
    debuggable = false
    minifyEnabled = false
}
